name: Build SHIVAM STORE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIVAM_STORE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shivam-store-release.jks"
          chmod 600 "$RUNNER_TEMP/shivam-store-release.jks"

      - name: Build Release APK
        env:
          SHIVAM_STORE_KEYSTORE_FILE: ${{ runner.temp }}/shivam-store-release.jks
          SHIVAM_STORE_KEYSTORE_PASSWORD: ${{ secrets.SHIVAM_STORE_KEYSTORE_PASSWORD }}
          SHIVAM_STORE_KEY_ALIAS: ${{ secrets.SHIVAM_STORE_KEY_ALIAS }}
          SHIVAM_STORE_KEY_PASSWORD: ${{ secrets.SHIVAM_STORE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIVAM-STORE-release
          path: app/build/outputs/apk/release/*.apk
